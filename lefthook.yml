pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --verbose
      stage_fixed: false
      skip:
        - merge
        - rebase
    shellcheck:
      glob: "scripts/*.sh"
      run: shellcheck {staged_files}
      stage_fixed: false
      skip:
        - merge
        - rebase
